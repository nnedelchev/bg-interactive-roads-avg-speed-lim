<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulgaria Road Network Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="header">
        <div class="header-content">
            <div class="header-text">
                <h1>Отсечки със средна скорост(към 12.09.25)</h1>
            </div>
            <button id="about-btn" class="about-button">ℹ️ Информация за страницата</button>
        </div>

    </div>

    <div class="map-container">
        <div id="map"></div>
        <div id="loading" class="loading-message" style="display: none;">
            🛣️ Loading exact road segments from configuration file...
        </div>

        <div class="controls">
            <div id="road-controls">
                <!-- Road toggles will be dynamically generated here -->
            </div>
        </div>

        <div class="legend"></div>
    </div>

    <!-- About modal will be loaded here -->
    <div id="about-modal-container"></div>

    <!-- External JavaScript files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="roads-data-cached.js"></script>
    <script src="map-script.js"></script>
</body>

</html>
