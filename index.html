<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulgaria Road Network Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="header">
        <div class="header-content">
            <div class="header-text">
                <h1>🇧🇬 Отсечки със средна скорост</h1>
                <p>На тези отсечки тол камерите пресмятат вашата средна скорост!</p>
            </div>
            <button id="about-btn" class="about-button">ℹ️ About</button>
        </div>

    </div>

    <div class="map-container">
        <div id="map"></div>
        <div id="loading" class="loading-message" style="display: none;">
            🛣️ Loading exact road segments from configuration file...
        </div>

        <div class="controls">
            <!-- <h3>Сертифицирани отсечки за средна скорост</h3> -->
            <h3></h3>
            <div id="road-controls">
                <!-- Road toggles will be dynamically generated here -->
            </div>
        </div>

        <div class="legend">
            <div class="legend-stat">
                <span class="legend-stat-label">Отсечки пътища:</span>
                <span class="legend-stat-value" id="main-roads-count">-</span>
            </div>
            <div class="legend-stat">
                <span class="legend-stat-label">Отсечки пътища км.:</span>
                <span class="legend-stat-value" id="main-roads-distance">-</span>
            </div>
            <div class="legend-stat">
                <span class="legend-stat-label">Отсечки от магистрала:</span>
                <span class="legend-stat-value" id="highways-count">-</span>
            </div>
            <div class="legend-stat">
                <span class="legend-stat-label">Отсечки от магистрала км.:</span>
                <span class="legend-stat-value" id="highways-distance">-</span>
            </div>
        </div>
    </div>

    <!-- About modal will be loaded here -->
    <div id="about-modal-container"></div>

    <!-- External JavaScript files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="roads-data-cached.js"></script>
    <script src="map-script.js"></script>
</body>

</html>
